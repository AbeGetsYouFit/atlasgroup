<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14263D" />
    <!-- Meta Business portfolio domain verification (Atlas Group, domain id 1848734003239564).
         Must stay in this static head: Meta fails verification for a tag injected by React
         after load, and unverifying the domain would drop pixel and lead-ad permissions. -->
    <meta name="facebook-domain-verification" content="buws3kk4nrk6z6vr1khfmr1h5qqrgn" />
    <meta name="description" content="Atlas Properties, Atlas Insurance, Atlas Mortgage, and Atlas Construction. Real estate, insurance, mortgages, and construction connected around you in Metro Detroit and across Michigan." />
    <meta property="og:title" content="Atlas Group — Your next chapter. Built together." />
    <meta property="og:description" content="Property, protection, financing, and building. A clearer way forward in Michigan." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/media/hero-home.webp" />
    <link rel="icon" type="image/svg+xml" href="/brand/atlas-symbol-blue.svg" />
    <link rel="preload" as="image" href="/media/hero-home.webp" />
    <title>Atlas Group — Your next chapter. Built together.</title>
    <!-- Meta pixel, dataset "Atlas Group Website" (1509881880899534), owned by the Atlas
         Group business portfolio. The privacy notice's "Cookies and measurement" section
         is the disclosure for this; removing that section without removing this would
         make the notice wrong. -->
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1509881880899534');
      fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=1509881880899534&ev=PageView&noscript=1" /></noscript>
    <!-- React Router never reloads the document, so the snippet above would only ever
         count the first page of a visit. Re-fire PageView on each client-side route
         change, or /insurance looks like it gets no traffic. -->
    <script>
      (function () {
        var last = location.pathname;
        function view() {
          if (location.pathname === last) return;
          last = location.pathname;
          if (window.fbq) fbq('track', 'PageView');
        }
        ['pushState', 'replaceState'].forEach(function (m) {
          var orig = history[m];
          history[m] = function () { var r = orig.apply(this, arguments); view(); return r; };
        });
        window.addEventListener('popstate', view);
      })();
    </script>
  </head>
  <body><noscript><style>.reveal{opacity:1!important;transform:none!important}</style><p style="padding:12px 24px;font:14px sans-serif">You can browse Atlas without JavaScript. Enable it to use the inquiry form and interactive features.</p></noscript><div id="root"></div><script type="module" src="/src/main.tsx"></script>
    <!-- The GHL chat widget that was registered as the A2P opt-in mechanism was removed
         2026-10-25 after campaign CCON4S6 was approved; the inquiry form's own smsConsent
         checkbox is now the sole SMS opt-in. Reintroducing any third-party widget that
         collects phone numbers requires re-reading the A2P attestation first. -->
  </body>
</html>
